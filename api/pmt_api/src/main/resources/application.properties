spring.application.name=pmt_api

server.port=8082

# --- Connexion a la base MySQL (conteneur Docker pmt-db) ---
spring.datasource.url=jdbc:mysql://localhost:3306/pmt_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Paris
spring.datasource.username=ron_malvaux
spring.datasource.password=pmt_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# validate : le schema est decide par db/init/init.sql. Hibernate se contente
# de verifier au demarrage que les entites lui correspondent, et refuse de
# demarrer a la moindre divergence. Une seule source de verite.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# Ne jamais renvoyer de trace d'exception au client : elle expose les noms
# de classes, la structure interne et les versions de bibliotheques.
spring.web.error.include-stacktrace=never

# --- JWT ---
# 32 caracteres minimum pour HS256. En production : variable d'environnement.
pmt.jwt.secret=${PMT_JWT_SECRET:dev-only-secret-a-remplacer-32-caracteres-minimum}
pmt.jwt.expiration-seconds=3600

# --- CORS : le front Angular ---
pmt.cors.allowed-origin=http://localhost:4200
