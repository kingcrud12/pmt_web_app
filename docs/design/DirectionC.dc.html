  <style>

<div style="width:880px; height:600px; background:#F2F1ED; padding:28px 30px; display:flex; flex-direction:column; gap:16px">

    <p style="margin:0; font-size:13px; color:#5E605B; max-width:78ch; text-wrap:pretty"><strong style="font-weight:600">Pour :</strong> toute la largeur revient au contenu, et les cartes se prêtent mieux à un tableau de bord qu'à une liste. <strong style="font-weight:600">Contre :</strong> avec beaucoup de projets la barre haute sature vite, et le passage d'un projet à l'autre demande un clic de plus.</p>
